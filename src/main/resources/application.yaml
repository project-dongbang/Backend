spring:
  application:
    name: dongbang
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

app:
  notification:
    fee-due-reminder-cron: ${FEE_DUE_REMINDER_CRON:0 0 9 * * *}
    event-day-before-reminder-cron: ${EVENT_DAY_BEFORE_REMINDER_CRON:0 0 9 * * *}
  receipt-ocr:
    url: ${RECEIPT_OCR_URL:http://ocr:8000}
  storage:
    local-dir: ${LOCAL_UPLOAD_DIR:${java.io.tmpdir}/dongbang-uploads}
  auth:
    issuer: dongbang
    jwt-secret: ${JWT_SECRET:local-development-only-jwt-secret-change-before-production}
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
    oauth-state-ttl: PT5M
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    allowed-redirect-uris: ${AUTH_ALLOWED_REDIRECT_URIS:http://localhost:5173}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      callback-uri: ${GOOGLE_CALLBACK_URI:http://localhost:8080/api/v1/auth/oauth/google/callback}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
      scope: openid email profile
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      callback-uri: ${KAKAO_CALLBACK_URI:http://localhost:8080/api/v1/auth/oauth/kakao/callback}
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      scope: ${KAKAO_SCOPE:}
  aws:
    s3:
      enabled: ${AWS_S3_ENABLED:false}
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      endpoint: ${AWS_S3_ENDPOINT:}
      custom-domain: ${AWS_S3_CUSTOM_DOMAIN:}
      url-ttl: ${AWS_S3_URL_TTL:PT15M}
