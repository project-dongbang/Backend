name: Backend CD

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cd-production
  cancel-in-progress: false

jobs:
  verify_build_push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dongbang_test
          POSTGRES_USER: dongbang_test
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dongbang_test -d dongbang_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/dongbang_test
      DB_USERNAME: dongbang_test
      DB_PASSWORD: ci_only_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test and build application
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test integrationTest bootJar

      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci_only_password
          JWT_SECRET: ci_only_jwt_secret_that_is_at_least_256_bits_long
          AUTH_ALLOWED_REDIRECT_URIS: https://example.com
          AWS_S3_BUCKET: dongbang-ci-placeholder
          API_DOMAIN: api.example.com
        run: docker compose -f compose.prod.yaml config --quiet

      - name: Define immutable image name
        id: image
        shell: bash
        run: |
          repository="$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.repository }}:latest

  deploy:
    needs: verify_build_push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployment manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload production Compose manifest
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: compose.prod.yaml,Caddyfile,.env.prod.example
          target: /home/ubuntu/dongbang
          overwrite: true

      - name: Deploy to EC2 and wait for readiness
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/dongbang

            test -f .env || { echo "Missing /home/ubuntu/dongbang/.env" >&2; exit 1; }
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export IMAGE_NAME="${{ needs.verify_build_push.outputs.image_repository }}:${{ needs.verify_build_push.outputs.image_tag }}"
            docker compose -f compose.prod.yaml config --quiet
            docker compose -f compose.prod.yaml pull api
            docker compose -f compose.prod.yaml up -d --remove-orphans --wait --wait-timeout 120
            docker image prune -f

            echo "Deployment completed: $IMAGE_NAME"
